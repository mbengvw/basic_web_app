<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Pendaftaran</title>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    .form-container {
      background-color: rgb(105, 205, 130);
      width: 400px;
      padding: 20px;
      margin-top: 30px;
      border-radius: 8px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.4);
    }

    .form-container h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      margin-top: 5px;
      margin-bottom: 15px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      border: none;
      padding: 10px;
      border-radius: 5px;
      background-color: rgb(9, 105, 9);
      color: whitesmoke;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: rgb(72, 141, 72);
    }

    h2 {
      margin-top: 40px;
      text-align: center;
    }

    table {
      border-collapse: collapse;
      width: 80%;
      margin: 20px auto;
      background-color: #fff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .back-link {
      margin: 30px 0;
      text-align: center;
    }

    .back-link a {
      display: inline-block;
      padding: 10px 15px;
      border-radius: 5px;
      background-color: rebeccapurple;
      color: white;
      text-decoration: none;
    }

    .back-link a:hover {
      background-color: indigo;
    }
  </style>
</head>
<body>
  
  <div class="form-container">
    <h1>Formulir Pendaftaran</h1>
    <form action="#">
      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" name="nama" />

      <label for="jk">Jenis Kelamin</label>
      <select name="jk" id="jk">
        <option value="L">Laki-laki</option>
        <option value="P">Perempuan</option>
      </select>

      <label for="kelas">Kelas</label>
      <select name="kelas" id="kelas">
        <option value="10">Kelas 10</option>
        <option value="11">Kelas 11</option>
        <option value="12">Kelas 12</option>
      </select>

      <button id="btnSimpan" type="button">Simpan</button>
    </form>
  </div>

  <h2>📋 Daftar Siswa</h2>
  <table>
    <tr>
      <th>No</th>
      <th>Nama</th>
      <th>Kelas</th>
    </tr>
    <tr>
      <td>1</td>
      <td>Budi</td>
      <td>XI IPA</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Siti</td>
      <td>XI IPS</td>
    </tr>
    <tr>
      <td>3</td>
      <td>Andi</td>
      <td>XII IPA</td>
    </tr>
  </table>

  <div class="back-link">
    <a href="index.html">⬅ Kembali ke Halaman Utama</a>
  </div>

  <script>
    const tombol = document.getElementById("btnSimpan");
    tombol.addEventListener("click", function () {
      alert("Hai Semuaaa...");
    });
  </script>
  
</body>
</html>
